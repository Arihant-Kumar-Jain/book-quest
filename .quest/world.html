<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#070b14; --panel:rgba(13,18,31,.94); --panel-2:rgba(22,29,46,.96); --line:rgba(230,192,104,.20); --line-2:rgba(255,255,255,.08);
  --text:#efe6d2; --muted:#a3abbd; --dim:#6c7588;
  --gold:#e6c068; --gold-2:#f6dc93; --xp:#f3c74b; --teal:#5fd4c0; --green:#73d39a; --red:#ef6a5f; --ice:#9cd3ff; --violet:#b69cff;
  --display:"Cinzel", Georgia, "Times New Roman", serif;
  --ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; --shadow:0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}

/* ── SVG world ── */
.node{cursor:pointer}
.lbl-name{font-family:var(--display);font-weight:700;font-size:19px;fill:var(--text);letter-spacing:.04em}
.lbl-bg{fill:rgba(9,13,24,.82);stroke:var(--line);stroke-width:1.5}
.ch .num{font-family:var(--display);font-weight:900;font-size:58px;fill:var(--text);text-anchor:middle}
.ch .disc{fill:#121a2b;stroke:#3a4458;stroke-width:4}
.ch .ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10}
.ch .ring{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round}
.ch.cleared .disc{fill:#2b2414;stroke:var(--gold)}
.ch.cleared .num{fill:var(--gold-2)}
.ch.active .disc{stroke:var(--teal)}
.ch.current .disc{stroke:var(--teal);stroke-width:6}
.ch.fog .num{fill:#8792a6}
.ch.optional .disc{stroke-dasharray:10 8}
.node:hover>.disc,.node.sel>.disc{stroke:#fff}
.node.sel>.selring{display:block}
.selring{display:none;fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:6 8;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.crown{fill:var(--gold)}
.q .body{fill:#141c2e;stroke:#8a7a4f;stroke-width:3}
.q.done .body{fill:var(--gold);stroke:#fff6d8}
.q.opt .body{stroke-dasharray:4 4}
.q .chk{fill:none;stroke:#2a210c;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.x .body{fill:#141c2e;stroke:#3fa596;stroke-width:3}
.x.done .body{fill:var(--teal);stroke:#e2fffa}
.x.clean .body{stroke:var(--gold-2);stroke-width:4}
.x .pip{fill:#c9b88a}
.x.done .pip{fill:var(--teal)}
.q:hover>.body,.x:hover>.body,.q.sel>.body,.x.sel>.body{stroke:#fff;stroke-width:4}
.qlbl{font-family:var(--mono);font-size:11px;fill:var(--muted);text-anchor:middle;display:none}
.orbit{fill:none;stroke:rgba(230,192,104,.18);stroke-width:2;stroke-dasharray:3 9}
#map:not(.znear) .qring{display:none}
#map.zfar .lbl{display:none}
#map.zclose .qlbl{display:block}
.boss .crest{fill:#2a1416;stroke:#7b3a36;stroke-width:4}
.boss .horn{fill:#5a2a27;stroke:#7b3a36;stroke-width:3}
.boss .bnum{font-family:var(--display);font-weight:900;font-size:40px;fill:#f2b9a8;text-anchor:middle}
.boss.ready .crest{fill:#3d1416;stroke:var(--red)}
.boss.ready .horn{fill:#7a2a24;stroke:var(--red)}
.boss.dead .crest{fill:#1d1c22;stroke:#55505c}
.boss.dead .horn{fill:#2b2a30;stroke:#55505c}
.boss.dead .bnum{fill:#77707e}
.boss.locked .bnum{fill:#9a7f7a}
.boss .slash{stroke:var(--gold);stroke-width:7;stroke-linecap:round}
.boss .lock{fill:#c9b9a6}
.boss .lbl-bg{stroke:rgba(239,106,95,.35)}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.8;transform:scale(1.06)}}
.fog ellipse{pointer-events:none}
.road-base{fill:none;stroke:#1b1a17;stroke-width:26;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.road-ahead{fill:none;stroke:#7d8494;stroke-width:6;stroke-linecap:round;stroke-dasharray:2 18}
.road-done{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.marker{animation:bob 2.4s ease-in-out infinite}
#L-top{transition:opacity .3s}
#map.znear #L-top{opacity:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.region{font-family:var(--display);font-weight:700;fill:rgba(239,230,210,.16);text-anchor:middle;letter-spacing:.32em}
.star .core{fill:#c9d2ea}
.star.lit .core{fill:#fff6d6}
.star.opt .core{fill:#7d879e}
.star:hover>.core,.star.sel>.core{fill:#fff}
.cline{stroke:rgba(170,186,230,.22);stroke-width:2}
.cline.lit{stroke:rgba(246,220,147,.75);stroke-width:3}
.book .core{fill:#20294a;stroke:#b6c3ff;stroke-width:3}
.book.done .core{fill:#4a3a12;stroke:var(--gold-2)}
.book .init{font-family:var(--display);font-weight:900;font-size:22px;fill:#e6ecff;text-anchor:middle}
.skytitle{font-family:var(--display);font-weight:700;font-size:44px;fill:#dfe6ff;text-anchor:middle;letter-spacing:.12em}
.skysub{font-family:var(--ui);font-size:22px;fill:#97a3c7;text-anchor:middle;letter-spacing:.06em}
.lab .body{fill:#2b2350;stroke:var(--violet);stroke-width:2.5}
.lab.done .body{fill:var(--violet);stroke:#efe8ff}
.twinkle{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

/* ── HUD ── */
.hud{position:fixed;z-index:10;display:flex;gap:10px;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hud-l{top:16px;left:16px;padding:10px 16px 10px 10px;gap:12px;width:min(360px,calc(100vw - 32px))}
.lvl{position:relative;width:54px;height:60px;flex:none}
.lvl svg{width:100%;height:100%}
.lvl span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;color:#2a210c;padding-top:2px}
.lvl-info{flex:1;min-width:0}
.lvl-title{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:7px 0 5px;border:1px solid rgba(255,255,255,.06)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c98d2b,var(--xp),#fff1b8);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xp-meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.xp-meta span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud-c{top:16px;left:50%;transform:translateX(-50%)}
.pill{display:flex;align-items:center;gap:7px;padding:8px 13px;background:var(--panel);border:1px solid var(--line-2);border-radius:99px;box-shadow:var(--shadow);font-size:13px;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums;font-size:14px}
.pill span{color:var(--muted);font-size:12px}
.pill.risk{border-color:rgba(243,199,75,.6)}
.pill svg{width:20px;height:20px}
#hud-r{top:16px;right:16px}
.ib{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line-2);display:grid;place-items:center;font-size:17px;position:relative;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.ib:hover{border-color:var(--gold);transform:translateY(-1px)}
.ib .live{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#6c7588}
.ib .live.on{background:var(--teal);box-shadow:0 0 8px var(--teal)}
body.remote .local-only{display:none!important}
.ib small{position:absolute;bottom:-6px;right:-6px;background:var(--gold);color:#241c08;font-weight:700;font-size:10px;border-radius:99px;padding:1px 5px}
.focus{height:40px;padding:0 15px;border-radius:12px;border:1px solid rgba(95,212,192,.5);background:rgba(20,48,48,.9);font-weight:600;font-size:13.5px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.focus.on{border-color:var(--red);background:rgba(58,20,22,.92)}
.focus .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.focus.on .dot{background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* minimap + zoom */
#mini{position:fixed;left:16px;bottom:16px;z-index:10;padding:6px;border-radius:12px}
#mini canvas{display:block;width:232px;height:146px;border-radius:8px;cursor:crosshair}
#zoom{position:fixed;left:270px;bottom:16px;z-index:10;display:flex;flex-direction:column;gap:6px}
#zoom .ib{font-size:18px}

/* next-up bar */
#next{position:fixed;bottom:16px;left:326px;right:16px;z-index:9;display:flex;justify-content:center;gap:10px;pointer-events:none;transition:right .25s}
body.panel-open #next{right:428px}
@media (max-width:1440px){body.panel-open #next{display:none}}
.nb{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;max-width:420px;min-width:0}
.nb-txt{min-width:0}
.nb-k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.nb-t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-m{font-size:12px;color:var(--muted)}
.nb .acts{display:flex;gap:6px;flex:none}

/* buttons */
.btn{border:1px solid rgba(230,192,104,.55);background:linear-gradient(180deg,#3a2f14,#251e0d);color:var(--gold-2);font-weight:600;font-size:12.5px;border-radius:9px;padding:7px 11px;white-space:nowrap;transition:filter .12s,transform .12s}
.btn:hover{filter:brightness(1.25);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14);color:var(--text)}
.btn.teal{background:linear-gradient(180deg,#14403c,#0d2b28);border-color:rgba(95,212,192,.6);color:#c9fff5}
.btn.red{background:linear-gradient(180deg,#5a1a17,#3a100e);border-color:rgba(239,106,95,.7);color:#ffd9d3}
.btn.sm{padding:4px 8px;font-size:11.5px;border-radius:7px}

/* side panel */
#panel{position:fixed;top:84px;right:16px;bottom:16px;width:400px;z-index:11;display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
body.panel-open #panel{transform:none}
#panel .ph{padding:16px 18px 12px;border-bottom:1px solid var(--line-2);position:relative}
#panel .close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--muted)}
.kick{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
#panel .ph .kick{padding-right:36px}
#panel h2{font-family:var(--display);font-weight:700;font-size:21px;margin:5px 34px 8px 0;line-height:1.2}
#panel .pb{overflow:auto;padding:14px 18px 18px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip.gold{color:var(--gold-2);border-color:rgba(230,192,104,.4)}
.chip.ok{color:#c9ffe0;border-color:rgba(115,211,154,.5)}
.chip.warn{color:#ffe1a6;border-color:rgba(243,199,75,.5)}
.chip.bad{color:#ffc9c2;border-color:rgba(239,106,95,.5)}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#c98d2b,var(--gold-2));border-radius:99px}
.prog.hp i{background:linear-gradient(90deg,#9c2b25,#ff7a6b)}
.prog.teal i{background:linear-gradient(90deg,#1f8f80,var(--teal))}
.muted{color:var(--muted)}
.small{font-size:12px}
p.task{font-size:14px;line-height:1.55;margin:12px 0}
.sec{margin-top:18px}
.sec h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:13px}
.row:hover{background:rgba(255,255,255,.05)}
.row .tk{width:18px;text-align:center;flex:none;color:var(--dim)}
.row.done .tk{color:var(--gold)}
.row.xd .tk{color:var(--teal)}
.row .id{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none;min-width:38px}
.row .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .tt{color:var(--muted)}
.row .pg{font-size:11px;color:var(--dim);flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
code.path{font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.35);border:1px solid var(--line-2);padding:5px 8px;border-radius:7px;display:block;word-break:break-all;color:#cfd6e6;margin-top:10px}
.goal{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:9px;cursor:pointer;font-size:13px;line-height:1.45}
.goal:hover{background:rgba(255,255,255,.05)}
.goal .bx{width:18px;height:18px;border-radius:5px;border:2px solid #8a6a62;flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#1b0d0b}
.goal.on .bx{background:var(--red);border-color:#ffb2a8}
.goal.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.goal code,.task code{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.07);padding:1px 4px;border-radius:4px}
.hint{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.04);border:1px dashed var(--line-2);border-radius:10px;padding:9px 11px;margin-top:12px;line-height:1.5}

/* tooltip, toasts, result, modal */
#tip{position:fixed;z-index:30;pointer-events:none;background:rgba(8,11,20,.95);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;max-width:300px;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
#tip b{font-weight:600}
#tip .tk{color:var(--gold);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
#toasts{position:fixed;top:72px;right:16px;z-index:40;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
body.panel-open #toasts{right:428px}
.toast{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);animation:tin .35s cubic-bezier(.2,.8,.2,1);max-width:360px}
.toast.badge{display:flex;gap:12px;align-items:center;border-color:rgba(243,199,75,.7)}
.toast.badge .e{font-size:28px}
.toast .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
#result{position:fixed;left:16px;bottom:184px;z-index:12;width:min(560px,calc(100vw - 32px));display:none}
#result.show{display:block;animation:tin .25s}
#result .rh{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px}
#result .rh .cmd{font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#result pre{margin:0;max-height:38vh;overflow:auto;padding:10px 12px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:#d7deec;border-top:1px solid var(--line-2);white-space:pre-wrap;word-break:break-word}
#result.ok .badge-s{color:var(--green)}
#result.err .badge-s{color:var(--red)}
.xpfloat{position:fixed;z-index:45;pointer-events:none;font-family:var(--display);font-weight:900;font-size:26px;color:var(--xp);text-shadow:0 2px 0 #3b2a00,0 0 18px rgba(243,199,75,.6);animation:float 1.6s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
#modal{position:fixed;inset:0;z-index:50;background:rgba(3,5,10,.62);display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
#modal .box{width:min(760px,100%);max-height:86vh;overflow:auto;padding:22px 24px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
#modal h2{font-family:var(--display);margin:0 0 4px;font-size:24px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.bdg{border:1px solid var(--line-2);border-radius:12px;padding:12px;text-align:center;background:rgba(255,255,255,.03)}
.bdg .e{font-size:32px;line-height:1.2}
.bdg .n{font-weight:600;font-size:13px;margin-top:6px}
.bdg .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.bdg.off{opacity:.42}
.bdg.off .e{filter:grayscale(1) brightness(.6)}
.bdg.on{border-color:rgba(243,199,75,.55);background:linear-gradient(180deg,rgba(243,199,75,.10),rgba(255,255,255,.02))}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px;margin-top:14px}
kbd{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-bottom-width:2px;border-radius:6px;padding:2px 6px}
textarea,input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line-2);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
textarea:focus,input:focus{outline:2px solid rgba(230,192,104,.5);outline-offset:1px}
.chron{list-style:none;margin:14px 0 0;padding:0;font-size:13px}
.chron li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.chron .t{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;width:96px}
.chron .x{margin-left:auto;color:var(--xp);font-weight:600;font-variant-numeric:tabular-nums}
#banner{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;pointer-events:none;flex-direction:column;text-align:center}
#banner.show{display:flex}
#banner .bk{font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);animation:rise .5s both}
#banner .bt{font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,72px);letter-spacing:.06em;color:#fff3cf;text-shadow:0 0 30px rgba(243,199,75,.55),0 4px 0 #3b2a00;animation:rise .6s .05s both}
#banner .bs{font-family:var(--display);font-size:clamp(16px,2.4vw,24px);color:var(--text);margin-top:6px;animation:rise .6s .15s both}
#banner.red .bt{color:#ffd2cb;text-shadow:0 0 34px rgba(239,106,95,.7),0 4px 0 #3a0d0a}
#banner::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 65%)}
#banner>*{position:relative}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}}
.spark{position:fixed;z-index:61;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:burst 1.4s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

<script>
"use strict";
const TOKEN = "__QUEST_TOKEN__";
let W = 7000, H = 4400;
const SKY = 1060;
// the road: [type, id, x, y] for every chapter, with each boss right after the last chapter it needs.
// Laid out from the book itself (layoutWorld), so any number of chapters and bosses fits.
let STOPS = [], ROAD = [], ROAD_SAMPLES = [], SKY_X = {}, BIOMES = {}, REGIONS = [], LAST_CH = 1;
const BIOME = {meadow:"#2f4c33", forest:"#233f2c", highland:"#34404e", tundra:"#3c495b", ember:"#47302d", isle:"#3a4733"};
const BIOME_ORDER = ["meadow", "forest", "highland", "tundra", "ember"];
function roman(n){ let o = ""; [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]].forEach(([v, r]) => { while (n >= v){ o += r; n -= v; } }); return o; }
const $ = s => document.querySelector(s);
const svg = $("#map"), worldG = $("#world");
const S = {st:null, prev:null, idx:{}, nodes:{}, sel:null, view:{x:0,y:0,k:.2}, anim:null, inertia:null, busy:false, anchor:null, labelScale:1};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
let store = {};
try { store = JSON.parse(localStorage.getItem("quest-world") || "{}"); } catch (e) { store = {}; }
function saveStore(){ try { localStorage.setItem("quest-world", JSON.stringify(store)); } catch (e) {} }

/* ───────────── sound ───────────── */
let AC = null;
function tone(freqs, dur = .14, type = "triangle", gap = .07, vol = .05){
  if (store.mute) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime + .01;
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = t0 + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .03);
    });
  } catch (e) {}
}
const SFX = {
  xp: () => tone([660, 990], .13), level: () => tone([523, 659, 784, 1047, 1319], .32, "triangle", .1, .07),
  boss: () => tone([147, 196, 294, 392, 587], .4, "sawtooth", .1, .03), badge: () => tone([988, 1319, 1760], .2, "sine", .07, .05),
  err: () => tone([233, 175], .2, "square", .1, .025), tick: () => tone([880], .06, "sine", 0, .03), open: () => tone([520], .05, "sine", 0, .02),
};

/* ───────────── API ───────────── */
async function api(path, body){
  const opt = body ? {method:"POST", headers:{"Content-Type":"application/json", "X-Quest-Token":TOKEN}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
async function run(args, anchorKey){
  if (S.busy) return;
  S.busy = true; document.body.style.cursor = "progress";
  S.anchor = anchorKey || S.sel;
  showResult(args, null);
  try {
    const res = await api("/api/cmd", {args});
    showResult(args, res);
    if (res.code !== 0) SFX.err();
    await refresh(true);
  } catch (e) {
    showResult(args, {code: 1, output: String(e.message || e)}); SFX.err();
  } finally { S.busy = false; document.body.style.cursor = ""; }
}
function showResult(args, res){
  const el = $("#result");
  const cmd = "$ ./quest " + args.map(a => /\s/.test(a) ? JSON.stringify(a) : a).join(" ");
  if (!res){ el.className = "card show"; el.innerHTML = `<div class="rh"><span class="badge-s">⏳</span><span class="cmd">${esc(cmd)}</span><span class="muted small">working…</span></div>`; return; }
  const out = (res.output || "").replace(/\n{3,}/g, "\n\n").replace(/^\n+|\s+$/g, "");
  const lines = out.split("\n").filter(l => l.trim());
  const ok = res.code === 0;
  const pick = ok ? [/✔|✨/, /📖|⚔|🐉|⏱|📝|↩|🏅|💀|🔒|🧪/] : [/✗/, /error:/, /✔|📖|⚔/];
  const first = (pick.map(re => lines.find(l => re.test(l))).find(Boolean) || lines[0] || (ok ? "done" : "failed")).trim().replace(/^[✔✗]\s*/, "");
  const long = lines.length > 3 || !ok;
  el.className = "card show " + (ok ? "ok" : "err");
  el.innerHTML = `<div class="rh"><span class="badge-s">${ok ? "✔" : "✗"}</span><span class="cmd" title="${esc(cmd)}">${esc(first)}</span>
    ${long ? `<button class="btn ghost sm" data-act="toggleOut">${ok ? "Details" : "Hide"}</button>` : ""}
    <button class="btn ghost sm" data-act="closeOut" aria-label="Dismiss">✕</button></div>
    ${long ? `<pre style="${ok ? "display:none" : ""}">${esc(cmd + "\n" + out)}</pre>` : ""}`;
  clearTimeout(S.resultTimer);
  if (ok && !long) S.resultTimer = setTimeout(() => el.classList.remove("show"), 4500);
}

/* ───────────── state ───────────── */
async function refresh(celebrate){
  let st;
  try { st = await api("/api/state"); $("#offline").style.display = "none"; }
  catch (e) { $("#offline").style.display = "block"; return; }
  S.prev = S.st; S.st = st; S.idx = indexState(st);
  if (!S.staticBuilt){ layoutWorld(st); buildStatic(); S.staticBuilt = true; }
  renderDynamic(); renderHUD(); renderNext();
  if (S.sel && S.idx[S.sel]) renderPanel(S.sel);
  if (celebrate && S.prev) celebrateDiff(S.prev, st);
}
function indexState(st){
  const idx = {};
  st.chapters.forEach(c => {
    idx["ch:" + c.num] = {type:"ch", c};
    c.reading.forEach(q => idx["rd:" + q.id] = {type:"rd", q, c});
    c.exercises.forEach(e => idx["ex:" + e.id] = {type:"ex", e, c});
  });
  st.bosses.forEach(b => idx["boss:" + b.n] = {type:"boss", b});
  st.side.forEach(s => {
    idx["side:" + s.key] = {type:"side", s};
    s.chapters.forEach(sc => sc.reading.forEach(q => idx["sq:" + q.id] = {type:"sq", q, s, sc}));
    s.labs.forEach(l => idx["lab:" + l.id] = {type:"lab", e:l, s});
  });
  return idx;
}

/* ───────────── static world (terrain, sky) ───────────── */
function biomeOf(type, id){ return BIOMES[type + id] || "meadow"; }
function layoutWorld(st){
  const after = {}, seq = [];
  st.bosses.forEach(b => { const last = Math.max(...b.unlock); (after[last] = after[last] || []).push(b.n); });
  st.chapters.forEach(c => { seq.push(["ch", c.num]); (after[c.num] || []).forEach(n => seq.push(["boss", n])); });
  st.bosses.forEach(b => { if (!seq.some(s => s[0] === "boss" && s[1] === b.n)) seq.push(["boss", b.n]); });
  LAST_CH = st.chapters.length ? st.chapters[st.chapters.length - 1].num : 1;
  const n = seq.length, margin = 560, perRow = 13, rowH = 760;
  const rows = Math.max(1, Math.ceil(n / perRow));
  H = SKY + 500 + (rows - 1) * rowH + 1250;
  const step = rows === 1 ? Math.min(560, (W - 2 * margin) / Math.max(1, n - 1)) : (W - 2 * margin) / (perRow - 1);
  const x0 = rows === 1 ? (W - step * (n - 1)) / 2 : margin;
  const R = rng(hash(st.book.title));
  STOPS = seq.map(([type, id], i) => {
    const r = Math.floor(i / perRow), j = i % perRow, xs = x0 + j * step;
    const x = r % 2 === 0 ? xs : W - xs;
    const y = H - 900 - r * rowH + Math.sin(j * 1.15 + r * 2.1) * 190 + (R() - .5) * 90;
    return [type, id, Math.round(x + (R() - .5) * 60), Math.round(y)];
  });
  ROAD = STOPS.map(s => [s[2], s[3]]);
  ROAD_SAMPLES = crSample(ROAD, 16);
  // biomes change in bands along the road (meadow → forest → highland → tundra → ember); optional chapters are islands
  const parts = st.book.parts || [];
  let lastBiome = BIOME_ORDER[0];
  seq.forEach(([type, id], i) => {
    let b;
    if (type === "ch"){
      const c = st.chapters.find(c => c.num === id);
      b = c && c.optional ? "isle" : BIOME_ORDER[Math.min(BIOME_ORDER.length - 1, Math.floor(i / n * BIOME_ORDER.length))];
      if (b !== "isle") lastBiome = b;
    } else b = lastBiome;
    BIOMES[type + id] = b;
  });
  // region names: each part's name under its stretch of road, or the book's title
  const groups = parts.length ? parts.map(p => ({name: p.name, pts: STOPS.filter(s => s[0] === "ch" && p.chapters.includes(s[1]))}))
                              : [{name: st.book.short, pts: STOPS}];
  REGIONS = groups.filter(g => g.pts.length).map(g => {
    const xs = g.pts.map(s => s[2]), ys = g.pts.map(s => s[3]);
    return {name: g.name.toUpperCase(), x: (Math.min(...xs) + Math.max(...xs)) / 2, y: Math.max(...ys) + 340};
  });
  // side books spread across the sky
  st.side.forEach((s, i) => SKY_X[s.key] = W * (i + .5) / st.side.length);
  document.title = `${st.book.short} · Quest`;
}
function crPath(pts){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function crSample(pts, per = 12){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    for (let s = 0; s < per; s++){
      const t = s / per, u = 1 - t;
      out.push([u*u*u*p1[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p2[0], u*u*u*p1[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p2[1]]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function buildStatic(){
  const R = rng(7), o = [];
  o.push(`<rect x="-3000" y="-3000" width="${W + 6000}" height="${H + 6000}" fill="url(#gSea)"/>`);
  o.push(`<rect x="-3000" y="-3000" width="${W + 6000}" height="${SKY + 3000}" fill="url(#gSky)"/>`);
  o.push(`<rect x="-3000" y="${SKY - 2}" width="${W + 6000}" height="260" fill="url(#gHorizon)"/>`);
  for (let i = 0; i < 7; i++) o.push(`<ellipse cx="${400 + i * 1050 + R() * 300}" cy="${260 + R() * 420}" rx="${900 + R() * 600}" ry="${180 + R() * 160}" fill="url(#${i % 2 ? "gAuroraB" : "gAuroraA"})"/>`);
  for (let i = 0; i < 340; i++){
    const x = R() * W, y = R() * (SKY - 40), r = R() < .08 ? 2.6 : .8 + R() * 1.4;
    o.push(`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#dfe6ff" ${i % 6 === 0 ? `class="twinkle" style="animation-delay:${(R() * 3).toFixed(2)}s"` : `opacity="${(.25 + R() * .55).toFixed(2)}"`}/>`);
  }
  // land: circles around stops and along the road
  const blobs = [];
  STOPS.forEach(s => {
    const b = biomeOf(s[0], s[1]);
    blobs.push([s[2], s[3], 330, b]);
    for (let j = 0; j < 4; j++){ const a = R() * 6.283, d = 170 + R() * 160; blobs.push([s[2] + Math.cos(a) * d, s[3] + Math.sin(a) * d * .8, 150 + R() * 110, b]); }
  });
  for (let i = 0; i < STOPS.length - 1; i++){
    const a = STOPS[i], b = STOPS[i + 1], dist = Math.hypot(b[2] - a[2], b[3] - a[3]), n = Math.ceil(dist / 150);
    for (let s = 1; s < n; s++){
      const t = s / n;
      blobs.push([a[2] + (b[2] - a[2]) * t + (R() - .5) * 90, a[3] + (b[3] - a[3]) * t + (R() - .5) * 90, 210 + R() * 80, biomeOf(...(t < .5 ? [a[0], a[1]] : [b[0], b[1]]))]);
    }
  }
  for (let i = 0, made = 0; i < 200 && made < 6; i++){                  // a few islands out at sea
    const x = 200 + R() * (W - 400), y = SKY + 260 + R() * (H - SKY - 420);
    if (STOPS.some(s => Math.hypot(s[2] - x, s[3] - y) < 700)) continue;
    blobs.push([x, y, 100 + R() * 70, "isle"]); made++;
  }
  o.push(`<g>${blobs.map(b => `<circle cx="${b[0].toFixed(0)}" cy="${b[1].toFixed(0)}" r="${(b[2] + 70).toFixed(0)}" fill="#14324a" opacity=".55"/>`).join("")}</g>`);

function skyLayout(s){

  const Rmax = 70 + (maxLen - 1) * stepR, cx = SKY_X[s.key], cy = 150 + Rmax * .82;

/* ───────────── view: pan, zoom, fly ───────────── */
function kMin(){ return Math.min(innerWidth / W, innerHeight / H) * .92; }
const K_MAX = 2.8;
function clampView(){
  const v = S.view, sw = innerWidth, sh = innerHeight, ww = W * v.k, wh = H * v.k, m = 160;
  v.x = ww + 2 * m < sw ? (sw - ww) / 2 : clamp(v.x, sw - ww - m, m);
  v.y = wh + 2 * m < sh ? (sh - wh) / 2 : clamp(v.y, sh - wh - m, m);
}
let rafPending = false;
function schedule(){ if (!rafPending){ rafPending = true; requestAnimationFrame(applyView); } }
function applyView(){
  rafPending = false;
  const v = S.view;
  worldG.setAttribute("transform", `translate(${v.x.toFixed(2)},${v.y.toFixed(2)}) scale(${v.k.toFixed(5)})`);
  const z = v.k < .3 ? "zfar" : v.k < .7 ? "zmid" : v.k < 1.45 ? "znear" : "zclose";
  const cls = z === "zclose" ? "znear zclose" : z;
  if (svg.dataset.z !== cls){ svg.setAttribute("class", cls + (svg.classList.contains("dragging") ? " dragging" : "")); svg.dataset.z = cls; }
  const ls = clamp(.74 / v.k, .62, 2.3);
  if (Math.abs(ls - S.labelScale) > .01){
    S.labelScale = ls;
    document.querySelectorAll("[data-lbl]").forEach(el => { const t = el.getAttribute("transform"); el.setAttribute("transform", t.replace(/scale\([^)]*\)/, `scale(${ls.toFixed(3)})`)); });
  }
  drawMiniView();
}
function zoomAt(px, py, f){
  const v = S.view, k2 = clamp(v.k * f, kMin(), K_MAX), r = k2 / v.k;
  v.x = px - (px - v.x) * r; v.y = py - (py - v.y) * r; v.k = k2;
  clampView(); schedule();
}
function viewCenter(){ const pw = document.body.classList.contains("panel-open") && innerWidth > 640 ? 420 : 0; return [(innerWidth - pw) / 2, innerHeight / 2]; }
function flyTo(wx, wy, k2, dur = 900){
  stopMotion();

    const bump = 1 - Math.sin(Math.PI * e) * clamp(Math.hypot(wx - c0[0], wy - c0[1]) / 9000, 0, .35);
    v.k = clamp(k * bump, kMin(), K_MAX);
    const cx = c0[0] + (wx - c0[0]) * e, cy = c0[1] + (wy - c0[1]) * e;
    v.x = sx - cx * v.k; v.y = sy - cy * v.k;

}
function stopMotion(){ if (S.anim){ cancelAnimationFrame(S.anim); S.anim = null; } if (S.inertia){ cancelAnimationFrame(S.inertia); S.inertia = null; } }
function flyToKey(key, k){ const p = S.nodes[key]; if (p) flyTo(p[0], p[1], k); }
function homeView(){
  const cur = S.st.current ?? LAST_CH;
  flyToKey("ch:" + cur, .62);
}
function worldView(){ const k = kMin(); flyTo(W / 2, H / 2, k, 800); }
function jumpTo(wx, wy, k){
  stopMotion();
  const v = S.view, [sx, sy] = viewCenter();
  v.k = clamp(k, kMin(), K_MAX); v.x = sx - wx * v.k; v.y = sy - wy * v.k; clampView(); applyView();
}
/* deep links: #ch:5, #boss:1, #side:prag, #rd:2.3, #world, #sky (add @zoom, e.g. #ch:5@1.4) */
function applyHash(animate){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return false;
  const [key, z] = h.split("@");
  const go = (x, y, k) => animate ? flyTo(x, y, k) : jumpTo(x, y, k);
  if (key === "world"){ closePanel(); go(W / 2, H / 2, kMin()); return true; }
  if (key === "sky"){ closePanel(); go(W / 2, SKY / 2, Math.max(kMin(), innerWidth / W * 1.05)); return true; }
  const p = S.nodes[key];
  if (!p) return false;
  select(key);
  const t = key.split(":")[0];
  go(p[0], p[1], +z || (t === "ch" ? .95 : t === "side" ? .62 : t === "boss" ? .8 : 1.15));

addEventListener("hashchange", () => applyHash(true));

/* pointer input: drag with inertia, pinch, wheel, click */

  const head = `<div class="kick">Boss ${roman(x.n)} · after chapters ${x.unlock.join(", ")}</div><h2>${esc(x.name)}</h2><div class="chips">${state}${chip(`+${x.xp} XP`, "gold")}${chip(kind)}</div>`;

  if (!x.defeated) b += `<div class="small muted" style="margin-top:6px">Boss HP</div><div class="prog hp"><i style="width:${total ? (hp / total * 100).toFixed(1) : 100}%"></i></div><div class="small muted">${hp}/${total} HP left · tick each condition as you finish it</div>`;
  b += `<div class="sec"><h3>Win conditions</h3>${x.goals.map((g, i) => `<div class="goal ${g.done ? "on" : ""}" data-act="tick" data-n="${x.n}" data-i="${i}" data-on="${g.done ? 0 : 1}"><span class="bx">${g.done ? "✓" : ""}</span><span>${md(g.text)}</span></div>`).join("")}</div>`;
  b += `<div class="acts"><button class="btn ghost" data-act="open" data-path="${esc(x.readme)}">📜 Open spec</button>${x.main ? `<button class="btn ghost" data-act="open" data-path="${esc(x.main)}">✎ Open ${esc(x.main.split("/").pop())}</button>` : ""}
    <button class="btn red" data-act="attack" data-n="${x.n}" ${!x.unlocked || x.defeated ? "disabled" : ""}>⚔ Attack</button></div>`;
  b += `<div class="hint">${x.unlocked ? (x.codes ? "Attacking builds your project (with sanitizers where noted) and runs its tests. The boss falls when the build passes and every box is ticked." : "Tick each win condition as you finish it, then attack. The boss falls once every box is ticked.") : `Locked until you clear chapters ${x.unlock.join(", ")}. You can read the spec and plan ahead now.`}</div>`;
  return [head, b];
}
function pSide(s){
  const head = `<div class="kick">Side quest · ${esc(s.author)}</div><h2>${esc(s.title)}</h2><div class="chips">${s.finished ? chip(`📗 finished ${fmtDate(s.finished)}`, "gold") : s.started ? chip("in progress", "ok") : chip("not started")}${chip(`${s.reading_done[0]}/${s.reading_done[1]} read`)}${chip(`${s.labs_done[0]}/${s.labs_done[1]} labs`)}${chip(`+${s.xp} XP when finished`, "gold")}</div>`;
  const tot = s.reading_done[1] + s.labs_done[1], got = s.reading_done[0] + s.labs_done[0];
  let b = `<div class="prog teal"><i style="width:${tot ? (got / tot * 100).toFixed(1) : 0}%"></i></div><div class="hint">${md(s.note)}</div><div class="hint">🧭 Best paired with: ${md(s.pairs_text)}.</div>
    <div class="acts">${bookBtn(s.key, s.chapters.flatMap(sc => sc.reading).find(q => !q.done && !q.optional) || s.chapters[0].reading[0], "📖 Open the book", "btn")}<button class="btn ghost" data-act="open" data-path="${esc(s.notes)}">📝 Notes (${s.notes_lines})</button></div>`;
  b += `<div class="sec"><h3>Labs</h3>${s.labs.map(l => rowEx(l, "lab")).join("")}</div>`;
  s.chapters.forEach(sc => { b += `<div class="sec"><h3>Ch ${sc.num} · ${esc(sc.title)}${sc.optional ? " · optional" : ""}</h3>${sc.reading.map(q => rowRead(q, "sq")).join("")}</div>`; });
  return [head, b];
}

/* ───────────── actions (event delegation) ───────────── */
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]");
  if (!a){
    const row = e.target.closest("[data-sel]");
    if (row){ const key = row.dataset.sel; select(key); flyToKey(key, Math.max(S.view.k, key.startsWith("sq") || key.startsWith("lab") ? .9 : 1.1)); }
    return;
  }
  e.preventDefault();
  const d = a.dataset, act = d.act;
  if (act === "read") run(["read", d.id], findKey(d.id));
  else if (act === "undo") run(["undo", d.id], findKey(d.id));
  else if (act === "claim") run(["done", d.id], findKey(d.id));
  else if (act === "run") run(["run", d.id], findKey(d.id));
  else if (act === "attack") run(["boss", d.n], "boss:" + d.n);
  else if (act === "open"){ try { await api("/api/open", {path:d.path}); toast(`✎ Opening <b>${esc(d.path.split("/").pop())}</b> in your editor`); } catch (err){ toast("Couldn't open: " + esc(err.message)); } }
  else if (act === "pdf") openBook(d.key || "main", +d.pdf || 1, d.label, d.quest);
  else if (act === "ipad") ipadModal();
  else if (act === "tick"){ SFX.tick(); try { await api("/api/tick", {n:+d.n, i:+d.i, on:d.on === "1"}); await refresh(false); } catch (err){ toast(esc(err.message)); } }
  else if (act === "locate" || act === "selfly"){ select(d.key); flyToKey(d.key, d.key.startsWith("ch") ? .95 : d.key.startsWith("side") ? .62 : d.key.startsWith("boss") ? .8 : 1.15); }
  else if (act === "close") closePanel();
  else if (act === "zin"){ const [x, y] = viewCenter(); zoomAnimated(x, y, 1.5); }
  else if (act === "zout"){ const [x, y] = viewCenter(); zoomAnimated(x, y, 1 / 1.5); }
  else if (act === "home") homeView();
  else if (act === "worldview") worldView();
  else if (act === "focus") focusToggle();
  else if (act === "journal") journalModal();
  else if (act === "badges") badgesModal();
  else if (act === "chronicle") chronicleModal();
  else if (act === "help") helpModal();
  else if (act === "undoLast") run(["undo"]);
  else if (act === "sound"){ store.mute = !store.mute; saveStore(); $("#b-sound").textContent = store.mute ? "🔇" : "🔊"; if (!store.mute) SFX.tick(); }
  else if (act === "toggleOut"){ const pre = $("#result pre"); if (pre){ const hidden = pre.style.display === "none"; pre.style.display = hidden ? "" : "none"; a.textContent = hidden ? "Hide" : "Details"; } }
  else if (act === "closeOut") $("#result").classList.remove("show");
  else if (act === "modalClose") closeModal();
  else if (act === "saveLog"){ const t = $("#log-t").value.trim(); if (t){ closeModal(); run(["log", t]); } }
  else if (act === "stopSave"){ const t = $("#stop-t").value.trim(); closeModal(); run(t ? ["stop", t] : ["stop"]); }
});
const IS_LOCAL = ["127.0.0.1", "localhost", "[::1]", "::1"].includes(location.hostname);
if (!IS_LOCAL) document.body.classList.add("remote");
async function openBook(key, pdf, label, quest){
  if (!IS_LOCAL){ location.href = `/read?book=${encodeURIComponent(key)}&page=${pdf}${quest ? "&quest=" + encodeURIComponent(quest) : ""}`; return; }
  try {
    const r = await api("/api/pdf", {key, page:pdf, quest});
    if (r.where === "ipad") toast(`📲 On your iPad in <b>${r.ms} ms</b> · page <b>${esc(label || pdf)}</b>`);
    else if (r.missed) toast(`📲 Your iPad didn't answer, so the book opened on your Mac. Jump to page <b>${esc(label || pdf)}</b> with ⌥⌘G in Preview.`);
    else toast(`📖 Opening the book on your Mac. Jump to page <b>${esc(label || pdf)}</b> with ⌥⌘G in Preview.${S.ipad && S.ipad.lan ? "" : ` <span class="muted">Reading on an iPad? Click 📲.</span>`}`);
  } catch (err){ toast("Couldn't open the book: " + esc(err.message)); }
}
function loadScript(src){
  return new Promise((ok, bad) => {
    if ([...document.scripts].some(s => s.src === src)) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s);
  });
}
async function pairPoll(addrs){
  if (!IS_LOCAL) return;
  try { S.ipad = await api("/api/pair" + (addrs ? "?addrs=1" : "")); $("#ipad-live").classList.toggle("on", !!(S.ipad.lan && S.ipad.connected)); } catch (e) {}
}
let pairTimer = null;
async function ipadModal(){
  await pairPoll(true);
  const p = S.ipad;
  if (!p) { toast("Couldn't reach the world server."); return; }
  if (!p.lan){
    openModal(`<h2>📲 Read on your iPad</h2><p class="muted">Your iPad can show the book and jump to the right page whenever you click <b>Open the book</b> here.</p>
      <div class="hint">1. Stop the world in your terminal with <kbd>Ctrl</kbd>-<kbd>C</kbd>.<br>2. Start it again with <code>./quest world --ipad</code><br>3. Click 📲 and scan the QR code with your iPad's camera.</div>
      <div class="acts"><button class="btn ghost" data-act="modalClose">Got it</button></div>`);
    return;
  }
  const addrs = p.addresses && p.addresses.length ? p.addresses : [{label:"Wi-Fi", url:p.url}];
  openModal(`<h2>📲 Read on your iPad</h2><p class="muted">Point the iPad's camera at this code. Both devices must share a network. It opens the reader; after that, <b>Open the book</b> here turns the iPad to that page.</p>
    <div class="chips" id="addr-pick" style="justify-content:center;margin-top:12px">${addrs.map((a, i) => `<button class="btn ${i ? "ghost" : ""} sm" data-addr="${i}">${esc(a.label)}</button>`).join("")}</div>
    <div id="qr" style="background:#fff;padding:14px;border-radius:14px;width:max-content;margin:14px auto;min-width:150px;min-height:150px;display:grid;place-items:center;color:#333;font-size:12px">loading…</div>
    <code class="path" id="qr-url">${esc(addrs[0].url)}</code>
    <div class="hint" id="pair-st">${p.connected ? "✅ iPad connected." : "⏳ Waiting for your iPad…"}</div>
    <details class="hint"><summary style="cursor:pointer">iPad can't open it?</summary><div style="margin-top:8px;line-height:1.55">
      • Campus and office Wi-Fi often blocks devices from talking to each other. Turn on your iPhone's <b>Personal Hotspot</b> and join it from both the Mac and the iPad, then reopen 📲 and pick the hotspot address.<br>
      • A USB-C cable alone doesn't connect Safari to the Mac. A cellular iPad can share its <b>Personal Hotspot</b> over the cable; when you do, a hotspot address shows up above.<br>
      • Try the <b>Bonjour name</b> option if the IP address changes.</div></details>
    <div class="hint">Tip: on the iPad, tap Share → <b>Add to Home Screen</b> for a full-screen Quest Reader app.</div>
    <div class="acts"><button class="btn ghost" data-act="modalClose">Done</button></div>`);
  let qrReady = false;
  const draw = i => {
    $("#qr-url").textContent = addrs[i].url;
    document.querySelectorAll("#addr-pick [data-addr]").forEach(b => b.classList.toggle("ghost", +b.dataset.addr !== i));
    if (!qrReady) return;
    const qr = qrcode(0, "M"); qr.addData(addrs[i].url); qr.make();
    $("#qr").innerHTML = qr.createSvgTag(5, 0);
  };
  $("#addr-pick").addEventListener("click", e => { const b = e.target.closest("[data-addr]"); if (b) draw(+b.dataset.addr); });
  try {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js");
    qrReady = true; draw(0);
  } catch (e){ $("#qr").textContent = "The QR code needs internet. Type the address below into Safari instead."; }
  clearInterval(pairTimer);
  pairTimer = setInterval(async () => {
    if (!$("#modal").classList.contains("show") || !$("#pair-st")){ clearInterval(pairTimer); return; }
    await pairPoll(false);
    if (S.ipad) $("#pair-st").innerHTML = S.ipad.connected ? "✅ iPad connected. Click <b>Open the book</b> on any quest to send its page there." : "⏳ Waiting for your iPad…";
  }, 2000);
}
function findKey(id){
  for (const p of ["rd", "ex", "sq", "lab"]) if (S.idx[p + ":" + id]) return p + ":" + id;
  return S.sel;
}
function focusToggle(){
  if (S.st.session){
    openModal(`<h2>End focus session</h2><p class="muted">What did you work on? This goes into journal.md with a summary of what you finished.</p>
      <input type="text" id="stop-t" placeholder="e.g. finally understood move semantics" maxlength="300">
      <div class="acts"><button class="btn" data-act="stopSave">⏹ Stop & log</button><button class="btn ghost" data-act="modalClose">Keep going</button></div>`);
    setTimeout(() => $("#stop-t").focus(), 50);
  } else run(["start"]);
}
function openModal(html){ $("#mbox").innerHTML = html; $("#modal").classList.add("show"); }
function closeModal(){ $("#modal").classList.remove("show"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
function journalModal(){
  openModal(`<h2>✎ Journal</h2><p class="muted">A line for journal.md: what clicked, what confused you, what to try next.</p><textarea id="log-t" rows="4" maxlength="900" placeholder="Today I learned…"></textarea>
    <div class="acts"><button class="btn" data-act="saveLog">Save to journal</button><button class="btn ghost" data-act="modalClose">Cancel</button></div>`);
  setTimeout(() => $("#log-t").focus(), 50);
}
function badgesModal(){

  openModal(`<h2>🏅 Badges</h2><div class="muted">${n} of ${bs.length} unlocked · +25 XP each</div><div class="bgrid">${bs.map(b => `<div class="bdg ${b.earned ? "on" : "off"}"><div class="e">${b.earned ? b.emoji : "🔒"}</div><div class="n">${esc(b.name)}</div><div class="d">${esc(b.desc)}</div>${b.earned && b.date ? `<div class="d" style="color:var(--gold)">${fmtDate(b.date)}</div>` : ""}</div>`).join("")}</div>
    <div class="acts"><button class="btn ghost" data-act="modalClose">Close</button></div>`);
}
function chronicleModal(){
  const p = S.st.player, max = Math.max(1, ...p.last14);
  const bars = p.last14.map((v, i) => `<div title="${v} XP" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:60px"><div style="height:${(v / max * 100).toFixed(0)}%;min-height:${v ? 3 : 1}px;background:${v >= p.goal ? "var(--gold)" : v ? "#8a7a4f" : "rgba(255,255,255,.08)"};border-radius:3px"></div></div>`).join("");
  openModal(`<h2>📜 Chronicle</h2><div class="muted">Last 14 days (gold = daily goal hit) · ${Math.floor(p.minutes / 60)}h ${p.minutes % 60}m focused · best streak ${p.best}</div>
    <div style="display:flex;gap:4px;margin-top:14px">${bars}</div>
    <ul class="chron">${S.st.recent.map(r => `<li><span class="t">${esc(r.at.slice(5, 16).replace("T", " "))}</span><span>${esc(r.label)}</span><span class="x">+${r.xp}</span></li>`).join("") || `<li class="muted">Nothing yet. Your adventure starts with one reading quest.</li>`}</ul>
    <div class="acts"><button class="btn ghost" data-act="modalClose">Close</button></div>`);
}
function helpModal(){
  openModal(`<h2>How to play</h2><div class="muted">Everything here runs the same commands as <code>./quest</code> in your terminal, on the same save file.</div>
    <div class="keys">
      <span><kbd>drag</kbd> / two-finger swipe</span><span>pan around the world</span>

      <span><kbd>⌘</kbd> + two-finger scroll</span><span>zoom with a trackpad (plain two-finger scroll pans)</span>
      <span><kbd>double-click</kbd></span><span>zoom in there</span>
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows</span><span>pan</span>

    <div class="acts"><button class="btn ghost" data-act="modalClose">Close</button></div>`);

document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")){ if (e.key === "Escape") closeModal(); if (e.key === "Enter" && e.target.id === "stop-t") $("[data-act=stopSave]").click(); return; }
  const k = e.key.toLowerCase(), P = 90;
  if (k === "escape"){ if ($("#modal").classList.contains("show")) closeModal(); else closePanel(); }
  else if (k === "arrowleft" || k === "a"){ S.view.x += P; clampView(); schedule(); }
  else if (k === "arrowright" || k === "d"){ S.view.x -= P; clampView(); schedule(); }
  else if (k === "arrowup" || k === "w"){ S.view.y += P; clampView(); schedule(); }
  else if (k === "arrowdown" || k === "s"){ S.view.y -= P; clampView(); schedule(); }
  else if (k === "+" || k === "="){ const [x, y] = viewCenter(); zoomAnimated(x, y, 1.4); }
  else if (k === "-" || k === "_"){ const [x, y] = viewCenter(); zoomAnimated(x, y, 1 / 1.4); }
  else if (k === "f") homeView();
  else if (k === "m") worldView();
  else if (k === "u") flyTo(W / 2, SKY / 2, Math.max(kMin(), innerWidth / W * 1.05));
  else if (k === "b") badgesModal();
  else if (k === "c") chronicleModal();
  else if (k === "j"){ e.preventDefault(); journalModal(); }
  else if (k === "?") helpModal();
});

/* ───────────── celebrations ───────────── */
function toast(html, cls = ""){
  const t = document.createElement("div"); t.className = "toast " + cls; t.innerHTML = html;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .4s"; t.style.opacity = 0; setTimeout(() => t.remove(), 450); }, 5200);
}
function screenOf(key){
  const p = S.nodes[key]; if (!p) return null;
  const v = S.view, x = p[0] * v.k + v.x, y = p[1] * v.k + v.y;
  return x > 0 && y > 0 && x < innerWidth && y < innerHeight ? [x, y] : null;
}
function xpFloat(n){
  const at = (S.anchor && screenOf(S.anchor)) || (() => { const r = $("#xp-fill").getBoundingClientRect(); return [r.right, r.bottom + 10]; })();
  const el = document.createElement("div"); el.className = "xpfloat"; el.textContent = `+${n} XP`;
  el.style.left = at[0] + "px"; el.style.top = (at[1] - 30) + "px";
  document.body.appendChild(el); setTimeout(() => el.remove(), 1700);
}
const queue = [];
let showing = false;
function bannerShow(kicker, title, sub, cls = "", sfx){ queue.push({kicker, title, sub, cls, sfx}); if (!showing) nextBanner(); }
function nextBanner(){
  const b = queue.shift(); if (!b){ showing = false; return; }
  showing = true;
  const el = $("#banner");
  el.className = "show " + b.cls;
  el.innerHTML = `<div class="bk">${esc(b.kicker)}</div><div class="bt">${esc(b.title)}</div>${b.sub ? `<div class="bs">${esc(b.sub)}</div>` : ""}`;
  (b.sfx || SFX.level)();
  burst(b.cls === "red" ? ["#ff7a6b", "#ffd2cb", "#f6dc93"] : ["#f6dc93", "#f3c74b", "#5fd4c0", "#ffffff"]);
  setTimeout(() => { el.className = ""; setTimeout(nextBanner, 250); }, 2600);
}
function burst(colors){
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (let i = 0; i < 70; i++){
    const s = document.createElement("div"), a = Math.random() * 6.283, d = 160 + Math.random() * 360;
    s.className = "spark"; s.style.left = cx + "px"; s.style.top = cy + "px"; s.style.background = colors[i % colors.length];
    s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
    s.style.animationDelay = (Math.random() * .15) + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 1700);
  }
}
function celebrateDiff(a, b){
  const dx = b.player.xp - a.player.xp;
  if (dx > 0){ xpFloat(dx); SFX.xp(); }
  b.chapters.forEach((c, i) => { if (c.cleared && !a.chapters[i].cleared) bannerShow("Chapter cleared", c.title, `Chapter ${c.num} · +100 XP`); });
  b.bosses.forEach((x, i) => {
    if (x.unlocked && !a.bosses[i].unlocked) bannerShow("A boss awakens", x.name, `Boss ${roman(x.n)} is ready to fight`, "red", SFX.boss);
    if (x.defeated && !a.bosses[i].defeated) bannerShow("Boss defeated", x.name, `+${x.xp} XP`, "red", SFX.boss);
  });
  b.side.forEach((s, i) => { if (s.finished && !a.side[i].finished) bannerShow("Side quest complete", s.short, `+${s.xp} XP`); });
  if (b.player.level > a.player.level) bannerShow("Level up", `Level ${b.player.level}`, b.player.title);
  const had = new Set(a.badges.filter(x => x.earned).map(x => x.id));
  b.badges.filter(x => x.earned && !had.has(x.id)).forEach((x, i) => setTimeout(() => { SFX.badge(); toast(`<span class="e">${x.emoji}</span><div><div class="k">Badge unlocked · +25 XP</div><b>${esc(x.name)}</b><div class="muted small">${esc(x.desc)}</div></div>`, "badge"); }, 400 + i * 700));
}

addEventListener("focus", () => refresh(true));
setInterval(() => { if (!document.hidden) refresh(true); }, 20000);
$("#b-sound").textContent = store.mute ? "🔇" : "🔊";
