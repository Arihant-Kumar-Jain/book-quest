name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (unit + end-to-end with PDFKit)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -W error::ResourceWarning -m unittest discover -s tests -v

  linux:
    name: Linux (unit tests; the PDFKit parts are skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
